[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreame-home"
version = "0.4.0b6"
description = "Dreame Home Laundry integration for Home Assistant: L9 washer and dryer"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pycryptodome>=3.20,<4"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dreamehome = ["data/*.json", "py.typed"]
